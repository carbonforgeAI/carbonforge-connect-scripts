name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aws/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - name: Format
        run: terraform fmt -check -recursive
        working-directory: .
      - name: Init
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate
      # Mocked providers and an overridden existing-logging check: no AWS credentials, no AWS CLI.
      - name: Test
        run: terraform test

  # The same checks against the lowest provider versions versions.tf allows, so a constraint
  # floor that the module does not actually work with fails here instead of for a customer.
  terraform-provider-floor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aws/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - name: Pin every provider to its floor
        run: |
          {
            echo 'terraform {'
            echo '  required_providers {'
            terraform providers -no-color \
              | sed -n 's|.*provider\[registry.terraform.io/hashicorp/\([a-z]*\)\] >= \([0-9.]*\),.*|    \1 = { source = "hashicorp/\1", version = "\2" }|p'
            echo '  }'
            echo '}'
          } > floor.tmp
          # Written aside first: terraform providers would also read a half-written override file.
          mv floor.tmp floor_override.tf
          cat floor_override.tf
          test "$(grep -c 'version = ' floor_override.tf)" -eq 3
      - name: Init
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate
      - name: Test
        run: terraform test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install pytest==9.0.3 ruff==0.13.0 mypy==1.18.2 pyyaml==6.0.2 types-PyYAML==6.0.12.20260906 cfn-lint==1.38.0
      - name: identifiers.tf and connect.yaml are in sync with aws/identifiers.json
        run: python scripts/gen_identifiers.py --check
      - name: CloudFormation lint
        run: cfn-lint aws/cloudformation/connect.yaml
      - name: Lint
        run: |
          ruff check --line-length 100 scripts aws/cloudformation
          ruff format --line-length 100 --check scripts aws/cloudformation
      - name: Types
        run: mypy --strict scripts aws/cloudformation/tests
      - name: Test
        run: pytest scripts/tests aws/cloudformation/tests
